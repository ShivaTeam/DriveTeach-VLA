# Planner pipeline — TGP-Planner CoT reasoning (CoT-SFT)
# Question: raw trajectory→pixels as 2D-TGP spatial guidance
# Answer: normalized BEV trajectory + CoT reasoning

dataset:
  name: navsim
  split: train

enrichers:
  - name: replace_image_base
    params:
      old_base: "/path/to/datasets/navsim"
      new_base: "navsim"
  - name: normalize_trajectory
    params:
      stats_file: "./stats/navsim_train_stats.json"
  - name: project_2d_tgp
    params:
      image_height: 1080
      image_width: 1920
      target_height: 448
      target_width: 784
  - name: merge_pseudo_labels
    params:
      source_path: "/path/to/VLA_train/parallel_infer/output/poutine_labels_infer_output.jsonl"
      parser: poutine
      key_field: id
      json_repair: true
  - filter_incomplete_pseudo

prompt: planner

output:
  format: json
  path: "./output/QA_navsim_train_planner.json"
